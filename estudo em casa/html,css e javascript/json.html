<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Requisição a recurso JSON</title>
</head>
<body>
    <button onclick="loadRemoteJson()">Carregar JSON</button>

    <pre id="resultado"></pre>

    <script>
        async function loadRemoteJson() {
            const url = "https://dummyjson.com/products/1";
            const resultado = document.getElementById("resultado");

            resultado.textContent = "Carregando...";

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Erro HTTP: " + response.status);
                }

                const data = await response.json();

                resultado.textContent =
                    "ID: " + data.id + "\n" +
                    "Título: " + data.title + "\n" +
                    "Descrição: " + data.description + "\n" +
                    "Preço: " + data.price + "\n" +
                    "Marca: " + data.brand + "\n" +
                    "Categoria: " + data.category;
            } catch (err) {
                resultado.textContent = "Erro: " + err.message;
                console.error(err);
            }
        }
    </script>
</body>
</html>
