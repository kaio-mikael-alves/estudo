<!doctype html>
<html lang="pt-BR">
    <head>
        <meta chaset="utf-8">
        <title>titulo introdutorio</title>
    </head>
    <body>
        <h1>imagens de cachorros</h1>
        <p> A partir do click no botão abaixo uma nova imagem aleatória de cachorros será carregada utilizando requisições assíncronas com fetch</p>
        <img id="image_dog" src="" alt="aguardando imagem" />
        <br/>
        <button onclick="carregarimagens()">carregar imagens</button>
    </body>
	<script type="text/javascript">
		function carregarimagens(){

			var url = "https://dog.ceo/api/breeds/image/random"
			fetch(url, {
				method: 'get'
			})
			.then(function(response) {
				response.json().then(function(data){
					console.log('resultado da requisição:' + data.message);
					var imgdog = document.getAnimations("image_dog");
					imgdog.src = data.message;
				})
			})
			.catch(function(err) {
				console.error('o seguinte erro ocorreu durante a requisição: ' + err);
			});
		}
	</script> 
</html>
