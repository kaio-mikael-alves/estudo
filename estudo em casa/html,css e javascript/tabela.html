<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabela</title>
    </head>
    <body>
        <h1>Minha primeira tabela em html</h1>
        <h2>tabela de notas em html</h2>
        <table width="100%" border="5">
            <thead>
                <tr>
                    <th>nome</th>
                    <th>disciplina</th>
                    <th>notas</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                <td>lucas</td>
                <td>html</td>
                <td>6</td>
            </tr>
            <tr>
                <td>joão</td>
                <td>css</td>
                <td>7</td>
            </tr>
            <tr>
                <td>maria</td>
                <td>javascript</td>
                <td>8</td>
            </tr>
            <tr>
                <td>ana</td>
                <td rowspan="2">nulo</td>
                <td>nulo</td>
            </tr>
            <tfoot>
                <tr>
                    <th colspan="3">tabela de notas</th>
                </tr>
            </tfoot>
            </tbody>
        </table>
    </body>
